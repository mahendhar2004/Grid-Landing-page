<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-circle.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Never indexed, and never linked to from the public site. The meta tag is
      belt to vercel.json's X-Robots-Tag braces: a crawler that reaches this
      page from a shared link never sees the header, only the markup.

      Deliberately NOT listed in robots.txt. Naming a secret path in
      robots.txt is the classic way to publish it to everyone who reads
      robots.txt.
    -->
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="theme-color" content="#0F2A2E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>Grid Console</title>
  </head>
  <body>
    <script>
      // Light or dark, decided before React runs so there is no flash: the
      // choice the person made last time, else the system's. `data-console`
      // switches on the console's design tokens (src/admin/design/tokens.css);
      // the `dark` class is kept for anything still written against it.
      (function () {
        var stored = null;
        try { stored = localStorage.getItem('grid-console-theme'); } catch (e) { /* not remembered */ }
        var dark = stored ? stored === 'dark' : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var root = document.documentElement;
        root.setAttribute('data-console', '');
        root.setAttribute('data-theme', dark ? 'dark' : 'light');
        root.classList.toggle('dark', dark);
      })();
    </script>
    <div id="admin-root"></div>
    <script type="module" src="/src/admin/main.tsx"></script>
  </body>
</html>
