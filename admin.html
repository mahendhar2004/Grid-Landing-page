<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-circle.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Never indexed, and never linked to from the public site. The meta tag is
      belt to vercel.json's X-Robots-Tag braces: a crawler that reaches this
      page from a shared link never sees the header, only the markup.

      Deliberately NOT listed in robots.txt. Naming a secret path in
      robots.txt is the classic way to publish it to everyone who reads
      robots.txt.
    -->
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="theme-color" content="#0F0D16" />
    <title>Grid Console</title>
  </head>
  <body>
    <script>
      // The console is dark-only - it is a tool, used for long stretches,
      // and the marketing site's light theme is wrong for a data table.
      // Set before React so there is no flash.
      document.documentElement.classList.add('dark');
      document.documentElement.style.colorScheme = 'dark';
    </script>
    <div id="admin-root"></div>
    <script type="module" src="/src/admin/main.tsx"></script>
  </body>
</html>
