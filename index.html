<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-circle.png" />
    <link rel="apple-touch-icon" href="/favicon-circle.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Grid. — The campus-exclusive marketplace for Indian college students. Buy and sell books, electronics, furniture and more within your college community." />
    <meta name="theme-color" content="#007BFF" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Grid. | The Smarter Campus Marketplace</title>
  </head>
  <body>
    <!-- Blocking theme script: must run before React — prevents flash of wrong theme -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('grid-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved || (prefersDark ? 'dark' : 'light');
          document.documentElement.classList.add(theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
