<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-circle.png" />
    <link rel="apple-touch-icon" href="/favicon-circle.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Grid v2 is coming — a marketplace where everyone is verified by their college or work email. Buy, sell and request inside your own campus or office Hub." />
    <meta name="theme-color" content="#6E52E8" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Grid v2 | Nobody here is a stranger" />
    <meta property="og:description" content="Verified by your college or work email, dropped straight into your Hub. Grid v2 is coming soon." />
    <meta property="og:image" content="/icon.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Grid v2 | Nobody here is a stranger" />
    <meta name="twitter:description" content="Verified by your college or work email, dropped straight into your Hub. Grid v2 is coming soon." />
    <meta name="twitter:image" content="/icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <title>Grid v2 | Nobody here is a stranger</title>
  </head>
  <body>
    <!-- Blocking theme script: must run before React — prevents flash of wrong theme -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('grid-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved || (prefersDark ? 'dark' : 'light');
          document.documentElement.classList.add(theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
